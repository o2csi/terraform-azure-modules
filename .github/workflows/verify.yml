name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          tofu_version: 1.12.6

      - name: Formatting
        run: tofu fmt -check -recursive

      # Every direct subdirectory of modules/ and examples/, with no filter.
      # OpenTofu is the only authority on what is a configuration and what is a
      # test: it accepts .tf, .tofu, .tf.json and .tofu.json, and finds tests
      # beside the configuration and under tests/. Any predicate here would
      # restate those rules and drift from them, and a directory it wrongly
      # rejected would be reported green. A directory holding no configuration
      # costs three no-op invocations. Directories share one provider cache, so
      # azurerm is fetched once per job.
      - name: Validate and test
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tofu-plugin-cache
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          status=0
          for dir in modules/*/ examples/*/; do
            [ -d "$dir" ] || { printf 'no directories matched: %s\n' "$dir" >&2; status=1; continue; }
            printf '::group::%s\n' "$dir"
            if tofu -chdir="$dir" init -backend=false -input=false >/dev/null; then
              tofu -chdir="$dir" validate || status=1
              tofu -chdir="$dir" test || status=1
            else
              printf 'init failed: %s\n' "$dir" >&2
              status=1
            fi
            printf '::endgroup::\n'
          done
          exit "$status"
