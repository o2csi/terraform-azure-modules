name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          tofu_version: 1.12.6

      - name: Formatting
        run: tofu fmt -check -recursive

      - name: Router egress unit and packet tests
        run: |
          sudo apt-get update -qq -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-
          sudo apt-get install -y nftables iproute2
          python3 modules/shared-egress/tests/test_egress.py
          sudo unshare --mount --net --propagation private python3 modules/shared-egress/tests/test_egress.py --network

      # Every subdirectory of modules/ and examples/, including one whose name
      # begins with a dot, which is what `dotglob` adds. Nothing filters them
      # further: OpenTofu is the only authority on what is a configuration and
      # what is a test, accepting .tf, .tofu, .tf.json and .tofu.json and finding
      # tests beside the configuration and under tests/. A predicate here would
      # restate those rules, drift from them, and report green on a directory it
      # wrongly rejected. A directory holding no configuration costs three no-op
      # invocations. Directories share one provider cache, so azurerm is fetched
      # once per job.
      - name: Validate and test
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tofu-plugin-cache
        run: |
          set -euo pipefail
          shopt -s dotglob
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          status=0
          for dir in modules/*/ examples/*/; do
            [ -d "$dir" ] || { printf 'no directories matched: %s\n' "$dir" >&2; status=1; continue; }
            printf '::group::%s\n' "$dir"
            if tofu -chdir="$dir" init -backend=false -input=false >/dev/null; then
              tofu -chdir="$dir" validate || status=1
              tofu -chdir="$dir" test || status=1
            else
              printf 'init failed: %s\n' "$dir" >&2
              status=1
            fi
            printf '::endgroup::\n'
          done
          exit "$status"
